name: Tests with matrix, pip, py3.15
# skips qt-related tests

on:
  workflow_dispatch:

jobs:
  test-on-python:
    name: "Tests with ${{ matrix.os }}, py${{ matrix.python-version }}, pip"
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos", "windows"]
        python-version: ["3.15-dev"]
        exclude:
          - os: ["macos", "windows"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install ubuntu libraries"
        if: runner.os == 'Linux'
        run: |
          sudo apt update 
          sudo apt -y install libegl1

      - name: "Install and upgrade"
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
      - name: "Install locan"
        run: pip install pyside6 .[test]
      - name: "Run tests"
        run: pytest

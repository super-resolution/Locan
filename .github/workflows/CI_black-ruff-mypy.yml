name:  CI checks with black, ruff, mypy, py3.13

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  check:
    name: "CI with ubuntu, py3.13, pip"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Install and upgrade"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group lint --group typing
      - name: "Format with black"
        run: black --check --diff "."
      - name: "Lint with ruff"
        run: ruff check --output-format=github "."
      - name: "Type check with pyrefly"
        run: pyrefly check --summarize-errors

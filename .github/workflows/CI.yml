name:  CI
# skips qt-related tests

on:
  push:
  workflow_dispatch:

env:
  OS: "linux"
  PYTHON_VERSION: "3.13"

jobs:
  check:
    name: "CI with ubuntu, py3.13, pip"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Install ubuntu libraries"
        run: |
          sudo apt update 
          sudo apt -y install libegl1

      - name: "Install and upgrade"
        run: |
          python -m pip install --upgrade pip
      - name: "Install locan"
        run: |
          python -m pip install --group lint --group typing --group test .[pyside6,all]

      - name: "Format with black"
        run: black --check --diff "."
      - name: "Lint with ruff"
        run: ruff check --output-format=github "."
      - name: "Type check with pyrefly"
        run: pyrefly check --summarize-errors

      - name: "Run tests"
        run: coverage run -m pytest --junitxml=./test-results-${{ env.PYTHON_VERSION }}.xml
      - name: "Prepare coverage reports"
        run: coverage xml
      - name: "Check coverage"
        run: coverage report --fail-under=90

      - name: "Upload coverage to CodeCov"
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          name: "CodeCov report"
          verbose: true
